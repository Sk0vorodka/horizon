name: Launcher Windows

on:
  push:
    branches: [main, feat/elyby]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build launcher (release)
        run: cargo build --release --manifest-path launcher/Cargo.toml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-launcher-windows
          path: launcher/target/release/horizon-launcher.exe
