# Codemagic build for the Horizon launcher (Windows x64).
#
# Build natively on a Windows 2022 runner (MSVC Build Tools preinstalled).
# The launcher is a separate cargo workspace (`launcher/`) excluded from the
# root game workspace.

workflows:
  launcher-windows:
    name: Horizon Launcher (Windows x64)
    instance_type: windows_x2
    max_build_duration: 120
    environment:
      vars:
        CARGO_TERM_COLOR: never
    scripts:
      - name: Install Rust and build launcher (release)
        script: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf -o "$TEMP/rustup-init.exe" https://win.rustup.rs/x86_64
            "$TEMP/rustup-init.exe" -y --default-toolchain stable --profile minimal
          fi
          export PATH="$USERPROFILE/.cargo/bin:$PATH"
          rustup default stable
          cargo build --release --manifest-path launcher/Cargo.toml
          ls -la launcher/target/release/horizon-launcher.exe
    artifacts:
      - launcher/target/release/horizon-launcher.exe
