# Codemagic build for the Horizon launcher (Windows x64).
#
# Cross-compiles the Rust launcher to `x86_64-pc-windows-gnu` on a macOS builder
# using the MinGW-w64 toolchain. The launcher is a separate cargo workspace
# (`launcher/`), excluded from the root game workspace.

workflows:
  launcher-windows:
    name: Horizon Launcher (Windows x64)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      vars:
        CARGO_TERM_COLOR: never
    scripts:
      - name: Install toolchain and build launcher (Windows x64, release)
        script: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            brew install mingw-w64
          fi
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          source "$HOME/.cargo/env"
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
          # Statically link the MinGW runtime so the .exe carries no gcc/winpthread DLLs.
          export RUSTFLAGS="-C target-feature=+crt-static"
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc
          cargo build --release \
            --manifest-path launcher/Cargo.toml \
            --target x86_64-pc-windows-gnu
          ls -la launcher/target/x86_64-pc-windows-gnu/release/horizon-launcher.exe
    artifacts:
      - launcher/target/x86_64-pc-windows-gnu/release/horizon-launcher.exe
